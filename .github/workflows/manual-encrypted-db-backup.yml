name: Manual encrypted database backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare PostgreSQL 17 client
        run: |
          docker pull postgres:17
          docker run --rm postgres:17 pg_dump --version

      - name: Validate required secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          test -n "$SUPABASE_DB_URL" || (echo "Missing SUPABASE_DB_URL" && exit 1)
          test -n "$BACKUP_ENCRYPTION_PASSWORD" || (echo "Missing BACKUP_ENCRYPTION_PASSWORD" && exit 1)

      - name: Create PostgreSQL backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backup
          docker run --rm \
            -e SUPABASE_DB_URL \
            -v "$PWD/backup:/backup" \
            postgres:17 \
            sh -lc 'pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-acl --file="/backup/chetesai.dump" && pg_restore --list "/backup/chetesai.dump" > /dev/null'

      - name: Encrypt backup
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in "backup/chetesai.dump" \
            -out "backup/chetesai-${GITHUB_RUN_ID}.dump.enc" \
            -pass env:BACKUP_ENCRYPTION_PASSWORD
          rm -f "backup/chetesai.dump"

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: chetesai-db-backup-${{ github.run_id }}
          path: backup/*.enc
          retention-days: 14
          if-no-files-found: error
