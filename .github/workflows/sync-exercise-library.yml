name: Sync exercise library to Supabase

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-exercise-library.yml'
      - 'supabase/migrations/20260812_seed_master_exercises.sql'
      - 'supabase/migrations/20260812_expand_master_exercises_105.sql'
      - 'supabase/migrations/20260812_add_warmup_stretch_exercises.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-exercises:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Supabase database connection
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || (echo "Missing SUPABASE_DB_URL" && exit 1)

      - name: Apply idempotent exercise seeds
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          docker run --rm \
            -e SUPABASE_DB_URL \
            -v "$PWD:/workspace" \
            -w /workspace \
            postgres:17 \
            sh -lc 'set -eu; \
              psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260812_seed_master_exercises.sql; \
              psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260812_expand_master_exercises_105.sql; \
              psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260812_add_warmup_stretch_exercises.sql'

      - name: Verify exercise inventory
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          docker run --rm \
            -e SUPABASE_DB_URL \
            postgres:17 \
            sh -lc 'psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "select grupo_muscular, count(*) as total from public.ejercicios where activo = true group by grupo_muscular order by grupo_muscular;"'
