  <rect x="48" y="38" width="544" height="844" rx="44" fill="url(#glow)" stroke="#f4d887" stroke-opacity=".12"/>

  <text fill="#f4ead4" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" letter-spacing="4.5">
    <textPath href="#brandArc" startOffset="50%" text-anchor="middle">CHETESAÍ FITNESS+</textPath>
  </text>

  <g transform="translate(320 470)" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" opacity=".95">
