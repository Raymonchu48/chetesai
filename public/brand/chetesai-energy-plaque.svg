<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 920" role="img" aria-labelledby="title desc">
  <title id="title">Chetesaí Fitness+ · Carga tus energías</title>
  <desc id="desc">Placa vertical oscura con emblema deportivo orbital, detalles dorados y figuras deportivas rojas.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a09" stop-opacity=".96"/>
      <stop offset=".55" stop-color="#121411" stop-opacity=".94"/>
      <stop offset="1" stop-color="#050605" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d58a"/>
      <stop offset=".46" stop-color="#c59a42"/>
      <stop offset="1" stop-color="#8e6728"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="43%" r="62%">
      <stop offset="0" stop-color="#d6aa50" stop-opacity=".17"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="brandArc" d="M132 232 Q320 92 508 232"/>
  </defs>

